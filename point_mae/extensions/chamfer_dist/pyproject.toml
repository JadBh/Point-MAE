[build-system]
requires = ["setuptools", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "chamfer"
version = "2.0.0"        # match whatever setup.py / chamfer.egg-info had
requires-python = ">=3.12"

[tool.setuptools]
# This distro ships only the compiled `chamfer` module — no pure-Python
# packages. Without this, setuptools' flat-layout auto-discovery sees
# __init__.py / test.py in this dir and errors on "multiple top-level packages".
py-modules = []