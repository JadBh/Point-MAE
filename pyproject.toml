[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "point-mae"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "easydict>=1.13",
    "editables>=0.6",
    "h5py>=3.16.0",
    "hatchling>=1.30.1",
    "ipython>=9.14.1",
    "knn-minimal",
    "laspy[laszip,lazrs]>=2.7.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pointnet2-ops",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.5",
    "termcolor>=3.3.0",
    "timm>=1.0.27",
    "torch>=2.12.1",
    "tqdm>=4.68.3",
    "transforms3d>=0.4.2",
]

# tells uv to inject the following dependencies when building the package.
# this is needed because uv builds packages in an isolated sandbox 
#[tool.uv.extra-build-dependencies]
#pointnet2-ops = [{ requirement = "torch", match-runtime = true }]

[tool.hatch.build.targets.wheel]
packages = ["point_mae"]
# maybe putting chamfer here would solve the dependency

[tool.uv.workspace]
members = [
    "Pointnet2_PyTorch/pointnet2_ops_lib",
    "knn-minimal",
    "point_mae/extensions/chamfer_dist",
]

[tool.uv.sources]
pointnet2-ops = { workspace = true }
knn-minimal = { workspace = true }
chamfer = { workspace = true } 