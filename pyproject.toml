[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "point-mae"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "easydict>=1.13",
    "h5py>=3.16.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "tensorboardx>=2.6.5",
    "termcolor>=3.3.0",
    "timm>=1.0.27",
    "tqdm>=4.68.3",
    "transforms3d>=0.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["point_mae"]
